.ctl .val{color:var(--accent);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
button{font:inherit;font-size:12.5px;padding:6px 14px;border:1px solid var(--ink);background:#fff;
 border-radius:4px;cursor:pointer}
button.on{background:var(--ink);color:#fff}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:2px 4px 8px}
.hint{color:var(--mid);font-size:12px;padding:2px 4px 24px}
.readout{display:flex;gap:24px;flex-wrap:wrap;font-size:12.5px;color:#555;padding:6px 4px 0}
.readout b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
&lt;/style&gt;&lt;/head&gt;
&lt;body&gt;
&lt;header&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;第九部分 · 9.3&lt;/div&gt;
&lt;h1&gt;相体积不可压缩&lt;/h1&gt;
&lt;div class=&quot;sub&quot;&gt;哈密顿流像剪切流体：一团相点被拉长、折叠，但面积（体积）始终不变。&lt;/div&gt;
&lt;/div&gt;&lt;/header&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;canvas id=&quot;cv&quot;&gt;&lt;/canvas&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;ctl&quot;&gt;&lt;label&gt;剪切强度&lt;span class=&quot;val&quot; id=&quot;sv&quot;&gt;0.5&lt;/span&gt;&lt;/label&gt;
&lt;input id=&quot;s&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;1.2&quot; step=&quot;0.05&quot; value=&quot;0.5&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;readout&quot; id=&quot;readout&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;hint&quot;&gt;空格：暂停 / 继续　　R：重置　　拖动滑块可实时改变参数&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
const cv = document.getElementById(&#x27;cv&#x27;);
const ctx = cv.getContext(&#x27;2d&#x27;);
const W = 1000, H = 620;
const DPR = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * DPR; cv.height = H * DPR;
ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
const INK=&#x27;#17181c&#x27;, GRAY=&#x27;#6b6b6b&#x27;, MID=&#x27;#a9a5a0&#x27;, LINE=&#x27;#ddd8d1&#x27;, ACC=&#x27;#a83228&#x27;, ACC2=&#x27;#2f6f8f&#x27;;
function clr(){ctx.clearRect(0,0,W,H);ctx.fillStyle=&#x27;#fff&#x27;;ctx.fillRect(0,0,W,H);}
function line(x1,y1,x2,y2,c,w,dash){ctx.save();ctx.strokeStyle=c||INK;ctx.lineWidth=w||1.2;
 if(dash){ctx.setLineDash(dash);}ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();}
function txt(s,x,y,size,c,align,bold){ctx.save();ctx.fillStyle=c||INK;
 ctx.font=(bold?&#x27;600 &#x27;:&#x27;&#x27;)+(size||13)+&#x27;px &quot;Microsoft YaHei&quot;,sans-serif&#x27;;
 ctx.textAlign=align||&#x27;left&#x27;;ctx.textBaseline=&#x27;middle&#x27;;ctx.fillText(s,x,y);ctx.restore();}
function arrow(x1,y1,x2,y2,c,w){const a=Math.atan2(y2-y1,x2-x1),h=8;
 line(x1,y1,x2,y2,c||INK,w||1.4);
 ctx.save();ctx.fillStyle=c||INK;ctx.beginPath();ctx.moveTo(x2,y2);
 ctx.lineTo(x2-h*Math.cos(a-.42),y2-h*Math.sin(a-.42));
 ctx.lineTo(x2-h*Math.cos(a+.42),y2-h*Math.sin(a+.42));ctx.closePath();ctx.fill();ctx.restore();}
function dot(x,y,r,c){ctx.save();ctx.fillStyle=c||INK;ctx.beginPath();ctx.arc(x,y,r||4,0,7);ctx.fill();ctx.restore();}
let paused=false, t=0, last=performance.now();
function loop(step,draw){requestAnimationFrame(function f(now){
  const dt=Math.max(0,Math.min(0.045,(now-last)/1000)); last=now;
  if(!paused){t+=dt; step(dt);} draw(); requestAnimationFrame(f);});}
window.addEventListener(&#x27;keydown&#x27;,e=&gt;{
  if(e.code===&#x27;Space&#x27;){paused=!paused;e.preventDefault();}
  if(e.key===&#x27;r&#x27;||e.key===&#x27;R&#x27;){if(window.resetSim)window.resetSim();}
});

const P={s:0.5};
(function(){const e=document.getElementById(&#x27;s&#x27;),o=document.getElementById(&#x27;sv&#x27;);
 const u=()=&gt;{P.s=parseFloat(e.value);o.textContent=P.s.toFixed(1);};
 e.addEventListener(&#x27;input&#x27;,u);u();})();
let blob=[];
for(let i=0;i&lt;1400;i++)blob.push([(Math.random()-0.5)*0.6,(Math.random()-0.5)*0.9]);
const cx=500, cy=330, S=150;
function draw(){
 clr();
 txt(&#x27;刘维尔定理：相体积不可压缩，只会被拉伸、折叠&#x27;,36,26,15,GRAY);
 const s=P.s*Math.sin(t*0.8);
 for(const b of blob){
  const q=b[0]+s*b[1], p=b[1];
  dot(cx+q*S,cy-p*S,1.6,&#x27;rgba(168,50,40,0.55)&#x27;);
 }
 // frame
 ctx.strokeStyle=LINE;ctx.lineWidth=1;ctx.strokeRect(cx-260,cy-220,520,440);
 txt(&#x27;区域被剪切变形，面积保持不变&#x27;,cx,cy+250,12,GRAY,&#x27;center&#x27;);
 document.getElementById(&#x27;readout&#x27;).innerHTML=
  &#x27;&lt;span&gt;剪切强度 s ＝ &lt;b&gt;&#x27;+P.s.toFixed(1)+&#x27;&lt;/b&gt;&lt;/span&gt;&#x27;+
  &#x27;&lt;span&gt;形状改变，体积不变&lt;/span&gt;&#x27;+
  &#x27;&lt;span&gt;哈密顿流的散度恒为零&lt;/span&gt;&#x27;;
}
loop(()=&gt;{},draw);
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;" title="刘维尔定理"></iframe></div>
</main>
<script>
const tabs=[...document.querySelectorAll('.tab')];
const frames=[...document.querySelectorAll('.sim-frame')];
function activate(i){
 tabs.forEach((t,k)=>t.classList.toggle('on',k===i));
 frames.forEach((f,k)=>{f.classList.toggle('on',k===i);
   if(k===i && !f.getAttribute('srcdoc')) f.setAttribute('srcdoc', f.dataset.src);});
}
tabs.forEach(t=>t.addEventListener('click',()=>activate(+t.dataset.idx)));
activate(0);
</script>
</body></html>
