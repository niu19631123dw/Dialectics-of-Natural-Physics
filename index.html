<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物理教科书-2026 - 在线阅读</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
        }
        .header {
            background: #161b22;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #30363d;
        }
        .header h1 { font-size: 22px; margin-bottom: 6px; color: #f0f6fc; }
        .header p { color: #8b949e; font-size: 13px; }
        
        /* 册别选择 */
        .volume-bar {
            background: #161b22;
            display: flex;
            justify-content: center;
            gap: 0;
            border-bottom: 1px solid #30363d;
        }
        .volume-btn {
            padding: 12px 35px;
            cursor: pointer;
            border: none;
            background: transparent;
            color: #8b949e;
            font-size: 15px;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
            position: relative;
        }
        .volume-btn.active {
            color: #58a6ff;
            border-bottom-color: #58a6ff;
        }
        .volume-btn:hover { color: #c9d1d9; }
        .volume-btn .badge {
            display: inline-block;
            background: #30363d;
            color: #8b949e;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 6px;
        }
        .volume-btn.active .badge {
            background: #1f6feb;
            color: white;
        }
        .volume-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .volume-btn:disabled .badge {
            background: #da3633;
            color: white;
        }
        
        /* 阅读方式选择 */
        .mode-bar {
            background: #0d1117;
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            border-bottom: 1px solid #21262d;
        }
        .mode-btn {
            padding: 8px 20px;
            cursor: pointer;
            border: 1px solid #30363d;
            background: #161b22;
            color: #8b949e;
            font-size: 13px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .mode-btn.active {
            background: #1f6feb;
            color: white;
            border-color: #1f6feb;
        }
        .mode-btn:hover:not(.active) { background: #21262d; }
        
        .content {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        /* 阅读器区域 */
        #viewer-area {
            background: #161b22;
            border-radius: 12px;
            border: 1px solid #30363d;
            overflow: hidden;
            height: 80vh;
            min-height: 500px;
        }
        #viewer-area iframe, #viewer-area embed {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }
        
        /* 下载区域 */
        .download-area {
            text-align: center;
            padding: 50px 20px;
        }
        .download-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            margin: 0 auto;
        }
        .download-card .icon { font-size: 64px; margin-bottom: 20px; }
        .download-card h2 { color: #f0f6fc; margin-bottom: 12px; font-size: 20px; }
        .download-card p { color: #8b949e; margin-bottom: 25px; font-size: 14px; line-height: 1.6; }
        .download-card .btn {
            display: inline-block;
            background: #238636;
            color: white;
            text-decoration: none;
            padding: 14px 40px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
        }
        .download-card .btn:hover { background: #2ea043; transform: translateY(-2px); }
        .download-card .file-info {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #30363d;
            color: #6e7681;
            font-size: 13px;
        }
        
        .notice {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px 20px;
            margin-bottom: 15px;
            color: #8b949e;
            font-size: 13px;
            line-height: 1.6;
        }
        .notice strong { color: #f0f6fc; }
        .notice a { color: #58a6ff; }
        
        .empty-state {
            text-align: center;
            padding: 100px 20px;
            color: #8b949e;
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 15px; }
        .empty-state h3 { color: #f0f6fc; margin-bottom: 10px; }
        
        @media (max-width: 600px) {
            .volume-btn { padding: 10px 20px; font-size: 13px; }
            .download-card { padding: 25px; }
            #viewer-area { height: 65vh; min-height: 350px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📚 物理教科书-2026</h1>
        <p>在线阅读与下载</p>
    </div>
    
    <!-- 册别选择 -->
    <div class="volume-bar">
        <button class="volume-btn active" onclick="switchVolume('shangce')">
            上册 <span class="badge">已上传</span>
        </button>
        <button class="volume-btn" onclick="switchVolume('xiace')" disabled>
            下册 <span class="badge">待上传</span>
        </button>
    </div>
    
    <!-- 阅读方式 -->
    <div class="mode-bar">
        <button class="mode-btn active" onclick="switchMode('native')">📖 浏览器阅读</button>
        <button class="mode-btn" onclick="switchMode('gdocs')">🌐 Google 预览</button>
        <button class="mode-btn" onclick="switchMode('download')">⬇ 下载</button>
    </div>
    
    <div class="content">
        <!-- 浏览器阅读 -->
        <div id="mode-native">
            <div class="notice">
                <strong>提示：</strong>使用浏览器内置 PDF 阅读器。如果显示异常，请尝试"Google 预览"或下载后阅读。
            </div>
            <div id="viewer-area">
                <embed id="native-embed" src="./shangce.pdf" type="application/pdf">
            </div>
        </div>
        
        <!-- Google 预览 -->
        <div id="mode-gdocs" style="display:none;">
            <div class="notice">
                <strong>提示：</strong>使用 Google Docs 在线预览。需要能访问 Google 服务。XeLaTeX 生成的 PDF 通常在此模式下显示更好。
            </div>
            <div id="viewer-area">
                <iframe id="gdocs-frame" src=""></iframe>
            </div>
        </div>
        
        <!-- 下载 -->
        <div id="mode-download" style="display:none;">
            <div class="download-area">
                <div class="download-card">
                    <div class="icon">📄</div>
                    <h2 id="download-title">物理教科书-2026 上册</h2>
                    <p id="download-desc">两卷本中文物理教材，涵盖经典力学、电磁学、热力学、相对论等内容。</p>
                    <a href="./shangce.pdf" class="btn" id="download-link" download="物理教科书-2026-上册.pdf">⬇ 下载 PDF 文件</a>
                    <div class="file-info" id="download-info">
                        文件名：shangce.pdf<br>
                        如果下载失败，请右键点击按钮选择"另存为"
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 册别配置：现在只有上册，以后添加下册时改这里
        const volumes = {
            shangce: {
                name: '上册',
                file: 'shangce.pdf',
                downloadName: '物理教科书-2026-上册.pdf',
                desc: '涵盖经典力学、电磁学、热力学、相对论等内容。'
            },
            xiace: {
                name: '下册',
                file: 'xiace.pdf',
                downloadName: '物理教科书-2026-下册.pdf',
                desc: '下册内容（待上传）。'
            }
        };
        
        let currentVolume = 'shangce';
        let currentMode = 'native';
        
        function switchVolume(volume) {
            if (volume === 'xiace') return; // 下册还没上传，不能切换
            
            currentVolume = volume;
            const vol = volumes[volume];
            
            // 更新册别按钮状态
            document.querySelectorAll('.volume-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', 
                    (idx === 0 && volume === 'shangce') || 
                    (idx === 1 && volume === 'xiace')
                );
            });
            
            // 更新下载信息
            document.getElementById('download-title').textContent = '物理教科书-2026 ' + vol.name;
            document.getElementById('download-desc').textContent = vol.desc;
            document.getElementById('download-link').href = './' + vol.file;
            document.getElementById('download-link').download = vol.downloadName;
            document.getElementById('download-info').innerHTML = 
                '文件名：' + vol.file + '<br>如果下载失败，请右键点击按钮选择"另存为"';
            
            // 更新阅读器
            document.getElementById('native-embed').src = './' + vol.file;
            if (currentMode === 'gdocs') {
                loadGdocs();
            }
        }
        
        function switchMode(mode) {
            currentMode = mode;
            
            // 更新按钮状态
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.toggle('active', 
                    (mode === 'native' && btn.textContent.includes('浏览器')) ||
                    (mode === 'gdocs' && btn.textContent.includes('Google')) ||
                    (mode === 'download' && btn.textContent.includes('下载'))
                );
            });
            
            // 显示对应区域
            document.getElementById('mode-native').style.display = mode === 'native' ? 'block' : 'none';
            document.getElementById('mode-gdocs').style.display = mode === 'gdocs' ? 'block' : 'none';
            document.getElementById('mode-download').style.display = mode === 'download' ? 'block' : 'none';
            
            if (mode === 'gdocs') {
                loadGdocs();
            }
        }
        
        function loadGdocs() {
            const vol = volumes[currentVolume];
            const baseUrl = window.location.href.replace('/index.html', '').replace(/\/$/, '');
            const pdfUrl = baseUrl + '/' + vol.file;
            document.getElementById('gdocs-frame').src = 
                'https://docs.google.com/gview?embedded=1&url=' + encodeURIComponent(pdfUrl);
        }
    </script>
</body>
</html>
